# Note: this file is not used by Cloud Run, only locally
# Most env vars are read from .env (generated from _.env.template by deploy script)
# Only PORT needs to be passed explicitly (not in .env, comes from AGENT_LOCAL_PORT)
services:
  plant-agent:
    build: .
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      # Override .env values for local development
      - API_HOST=0.0.0.0
      - API_RELOAD=true
      - PORT=${PORT}
      # uvicorn's reloader watches /app, which is a bind mount from macOS.
      # Docker Desktop does not deliver filesystem events across it, so
      # watchfiles saw nothing and the container kept serving whatever code it
      # started with — an edit looked live but wasn't. Polling instead.
      - WATCHFILES_FORCE_POLLING=true
    extra_hosts:
      # Lets the shopping tools reach a locally-running flask on the host; see
      # flask_url() in app/tools/shop/client.py. FLASK_URL itself is deliberately
      # NOT overridden here — deploy filters values containing __GCP_SECRET__ out
      # of the environment it passes to run_local.sh, so an override would
      # resolve to empty and clobber the correct value from .env.
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
