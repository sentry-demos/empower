name: selfheal-deploy
# Deploys flask to the flask-selfheal App Engine service on every merge to selfheal/base,
# creating a Sentry release named after the commit SHA with commits attached, so
# "Fixes FLASK-SELFHEAL-N" resolves the issue when the fix ships.

on:
  push:
    branches: [selfheal/base]
    paths: ["flask/**", "selfheal.env"]
  workflow_dispatch:

concurrency:
  group: selfheal-deploy
  cancel-in-progress: false

jobs:
  close-siblings:
    # Both versions open a PR for the same alert. Once one merges, close the other so
    # the receiver (which skips alerts while an agent PR is open) can fire again.
    if: vars.SELFHEAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --base selfheal/base --label selfheal-agent --state open --json number --jq '.[].number' |
            while read -r pr; do
              gh pr close "$pr" --delete-branch --comment "Superseded: another fix for this alert merged in ${GITHUB_SHA::7}."
            done

  deploy:
    # Off unless SELFHEAL_DEPLOY is "true": it deploys to the shared GCP project.
    # For a private test, run flask locally instead (selfheal/TESTING.md).
    if: vars.SELFHEAL_ENABLED == 'true' && vars.SELFHEAL_DEPLOY == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # GITHUB_SHA (set by Actions) becomes the release: flask-selfheal@<sha>, see selfheal.env
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # sentry-cli set-commits --auto needs history

      - name: Setup Sentry CLI
        uses: mathieu-bour/setup-sentry-cli@v1.3.0
        with:
          version: 2.17.4
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - id: auth
        name: Authenticate Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy flask-selfheal
        run: ./deploy flask --env=selfheal
