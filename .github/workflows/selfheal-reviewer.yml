name: selfheal-reviewer
# Reviewer agent: comments MERGE / ADJUST / CLOSE on each agent PR. It never approves;
# branch protection requires a human approval to merge.

on:
  pull_request:
    branches: [selfheal/base]
    types: [opened, ready_for_review]

jobs:
  review:
    if: vars.SELFHEAL_ENABLED == 'true' && startsWith(github.head_ref, 'selfheal/fix-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SELFHEAL_MODEL: ${{ vars.SELFHEAL_MODEL || 'claude-opus-5-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flask/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r flask/requirements.txt pytest requests
          npm install -g @anthropic-ai/claude-code

      - name: Gather the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          OUT="$RUNNER_TEMP/review"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          gh pr view "$PR" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$OUT/pr.md"
          gh pr diff "$PR" > "$OUT/pr.diff"
          python selfheal/harness/prepare.py review --out "$OUT"

      - name: Reviewer agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SELFHEAL_ANTHROPIC_API_KEY }}
          SELFHEAL_HARNESS_DSN: ${{ secrets.SELFHEAL_HARNESS_DSN }}
        run: |
          python selfheal/harness/run_agent.py --name reviewer --max-turns 15 \
            --prompt-file "$OUT/prompt.md" --out "$OUT" \
            --allowed-tools "Read Write Glob Grep Bash(python -m pytest:*)"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SELFHEAL_SLACK_WEBHOOK_URL: ${{ secrets.SELFHEAL_SLACK_WEBHOOK_URL }}
        run: |
          if [ ! -s "$OUT/review.md" ]; then
            echo "**Verdict: ?** The reviewer agent didn't produce a review; see the workflow log." > "$OUT/review.md"
          fi
          printf '\n\n_Reviewer agent. A human makes the merge decision._\n' >> "$OUT/review.md"
          gh pr comment "$PR" --body-file "$OUT/review.md"
          python selfheal/harness/report.py review --pr-url "$PR_URL" --review "$OUT/review.md"
