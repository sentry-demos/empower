name: selfheal-tests
# Required status check for selfheal/base (branch protection): the Flask test suite.

on:
  pull_request:
    branches: [selfheal/base]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: flask/requirements.txt

      - run: pip install -r flask/requirements.txt pytest

      - name: Flask tests
        run: python -m pytest flask/src/test -v

      - name: Receiver tests
        run: |
          pip install -r selfheal/receiver/requirements.txt
          cd selfheal/receiver && python -m pytest -v
