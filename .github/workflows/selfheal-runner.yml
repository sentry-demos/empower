name: selfheal-runner
# Self-healing demo. Started by a push to a selfheal/run/<id> branch: a single commit on top
# of a target's base branch that adds .selfheal/alert.json. The Cloud Run receiver creates
# these on a Sentry alert (from any configured org), and selfheal/scripts/trigger.sh creates
# them by hand. Push triggers use the workflow file on the pushed branch, so nothing here needs
# to live on master.
#
# Each job resolves the alert's target (selfheal/targets.json: base branch, Sentry org and
# project, code paths, tests, verification check) with selfheal/harness/target.py.
# The alert also picks the agent version (selfheal/harness/plan.py): with-seer or without-seer,
# from the event's se tag or the alert's name, or else SELFHEAL_VARIANTS. Each agent opens a
# draft PR, the reviewer agent comments on it, and Slack gets the result.
# Uses only the Actions GITHUB_TOKEN and the repo's existing GCP login. See selfheal/README.md.
run-name: "Self-heal: ${{ github.ref_name }}"

on:
  push:
    branches: ["selfheal/run/**"]

concurrency:
  # Runs go side by side, so several SEs can demo at once. The receiver already starts at most
  # one run per alert per issue (the run key in selfheal/run/[<version>/]<key>/<id>).
  group: selfheal-runner-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Optional overrides for the checkout target (demo); other targets use targets.json only
  SELFHEAL_VAR_SENTRY_ORG: ${{ vars.SELFHEAL_SENTRY_ORG }}
  SELFHEAL_VAR_SENTRY_PROJECT: ${{ vars.SELFHEAL_SENTRY_PROJECT }}
  SELFHEAL_VAR_SENTRY_ENVIRONMENT: ${{ vars.SELFHEAL_SENTRY_ENVIRONMENT }}
  SELFHEAL_VAR_SLACK_ALERT_MATCH: ${{ vars.SELFHEAL_SLACK_ALERT_MATCH }}
  SELFHEAL_MODEL: ${{ vars.SELFHEAL_MODEL }}
  SELFHEAL_MAX_TURNS: ${{ vars.SELFHEAL_MAX_TURNS }}
  SELFHEAL_HAIKU_MODEL: ${{ vars.SELFHEAL_HAIKU_MODEL }}
  SELFHEAL_MODEL_PROVIDER: ${{ vars.SELFHEAL_MODEL_PROVIDER || 'openrouter' }}
  SELFHEAL_MODEL_KEY_SECRET: ${{ vars.SELFHEAL_MODEL_KEY_SECRET || 'AGENT_OPENROUTER_API_KEY' }}
  SELFHEAL_GCP_PROJECT: ${{ vars.SELFHEAL_GCP_PROJECT || 'sales-engineering-sf' }}
  SELFHEAL_HARNESS_DSN: ${{ vars.SELFHEAL_HARNESS_DSN }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  plan:
    # Which version(s) this alert runs
    if: vars.SELFHEAL_ENABLED == 'true'  # opt-in per repo, so forks and other repos never run it
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
      slack_channels: ${{ steps.plan.outputs.slack_channels }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            selfheal
            .selfheal
      - id: plan
        env:
          SELFHEAL_VARIANTS: ${{ vars.SELFHEAL_VARIANTS }}
          # Read the issue's se tag, with the alert org's token
          SENTRY_MCP_TOKEN: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN }}
        run: |
          variants=$(python3 selfheal/harness/plan.py .selfheal/alert.json)
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "::notice title=Versions::$variants"
          # Where the alert posts in Slack, so the bot replies in those threads (else the
          # SELFHEAL_SLACK_CHANNEL variable's channel)
          channels=$(python3 selfheal/harness/slack_channels.py .selfheal/alert.json || echo '[]')
          echo "slack_channels=$channels" >> "$GITHUB_OUTPUT"
          echo "::notice title=Slack channels::${channels}"

  announce:
    # Replies in the Sentry alert's Slack thread as soon as the run starts. Runs alongside the
    # fix jobs (nothing waits on it), and a Slack problem never fails the run.
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            selfheal
            .selfheal

      - name: Post "self-heal started"
        continue-on-error: true
        env:
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_CHANNELS: ${{ needs.plan.outputs.slack_channels }}
          VARIANTS: ${{ needs.plan.outputs.variants }}
        run: |
          pip install requests
          eval "$(python selfheal/harness/target.py --alert .selfheal/alert.json --shell)"
          python selfheal/harness/report.py started --alert .selfheal/alert.json --variants "$VARIANTS"

  fix:
    needs: plan
    name: fix (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # push the fix branch
      pull-requests: write  # open the draft PR
      issues: write         # create the PR labels
      statuses: write       # post the required `pytest` status on the PR head
      id-token: write       # GCP login for the model key
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Take the alert, resolve its target, then work from the target's base
        run: |
          OUT="$RUNNER_TEMP/selfheal/${{ matrix.variant }}"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          cp .selfheal/alert.json "$RUNNER_TEMP/selfheal/alert.json"
          cp .selfheal/alert.json "$OUT/alert.json"  # travels with the scorecard to the review job
          cat "$RUNNER_TEMP/selfheal/alert.json"
          python3 selfheal/harness/target.py --alert "$RUNNER_TEMP/selfheal/alert.json" --github-env
          # The run commit only adds the alert file; drop it so it never reaches the agent's PR
          git reset -q --hard HEAD~1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            flask/requirements.txt
            agent/requirements.txt

      - name: Install the target's dependencies
        run: bash -c "$TARGET_INSTALL"

      - uses: ./.github/actions/selfheal-claude

      - name: Seer finds the root cause (with-seer)
        # The with-Seer agent doesn't explore Sentry: the harness gets the issue, Seer's root cause,
        # the failing cart and the impact first, and hands them to the agent in its prompt
        if: matrix.variant == 'with-seer'
        env:
          SENTRY_MCP_TOKEN: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN }}
        run: python selfheal/harness/seer_handoff.py --alert "$RUNNER_TEMP/selfheal/alert.json" --out "$OUT"

      - name: Post "Seer RCA" to Slack (with-seer)
        if: matrix.variant == 'with-seer'
        env:
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_CHANNELS: ${{ needs.plan.outputs.slack_channels }}
        run: python selfheal/harness/report.py status --kind seer --variant with-seer --dir "$OUT"

      - name: Prepare prompt and Sentry MCP
        env:
          # One Sentry token per org; prepare.py picks the alert's
          SENTRY_MCP_TOKEN: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN }}
        run: |
          # The MCP config holds the Sentry token and model key: keep it in its own folder,
          # which the agent is denied from reading (next step)
          SECRETS="$RUNNER_TEMP/selfheal-secrets"
          echo "SECRETS=$SECRETS" >> "$GITHUB_ENV"
          python selfheal/harness/prepare.py fix --variant ${{ matrix.variant }} \
            --alert "$RUNNER_TEMP/selfheal/alert.json" --out "$OUT" --mcp-out "$SECRETS/mcp.json"

      - name: Agent diagnoses and fixes (${{ matrix.variant }})
        continue-on-error: true  # still verify and score whatever it produced
        run: |
          DISALLOWED="Read(/$SECRETS/**) Grep(/$SECRETS/**) Glob(/$SECRETS/**)"
          # Bash limited to the target's tests and checks (e.g. cart replay, token budget)
          TOOLS="Read Edit Write Glob Grep $(python selfheal/harness/prepare.py allowed-bash)"
          if [ "${{ matrix.variant }}" = "with-seer" ]; then
            # Seer's root cause is in the prompt: no Sentry MCP for this agent
            MCP=()
          else
            MCP=(--mcp-config "$SECRETS/mcp.json")
            TOOLS="$TOOLS ToolSearch mcp__sentry"
            DISALLOWED="$DISALLOWED mcp__sentry__analyze_issue_with_seer"
          fi
          python selfheal/harness/run_agent.py \
            --name "fix-${{ matrix.variant }}" --variant "${{ matrix.variant }}" \
            --prompt-file "$OUT/prompt.md" --out "$OUT" "${MCP[@]}" \
            --allowed-tools "$TOOLS" --disallowed-tools "$DISALLOWED"

      - name: Post "Sentry MCP calls" to Slack (without-seer)
        # After the agent, not during it: the Slack token stays out of the agent's environment
        if: matrix.variant == 'without-seer'
        env:
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_CHANNELS: ${{ needs.plan.outputs.slack_channels }}
        run: python selfheal/harness/report.py status --kind sentry --variant without-seer --dir "$OUT"

      - name: Verify independently and open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          # "Drafting PR" in the alert's Slack thread
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_CHANNELS: ${{ needs.plan.outputs.slack_channels }}
          # For the leak check only
          SENTRY_MCP_TOKEN: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN }}
        run: |
          rm -rf "$SECRETS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python selfheal/harness/open_pr.py --variant ${{ matrix.variant }} --out "$OUT"

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}
          path: |
            ${{ env.OUT }}/stats.json
            ${{ env.OUT }}/verify.json
            ${{ env.OUT }}/result.json
            ${{ env.OUT }}/cart.json
            ${{ env.OUT }}/alert.json
            ${{ env.OUT }}/handoff.json
          if-no-files-found: warn

  review:
    # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows, so the reviewer
    # agent runs here, once per agent PR. It only comments; a human approves and merges.
    needs: [plan, fix]
    if: always() && needs.plan.result == 'success'
    name: review (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}

    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.variant }}
          path: ${{ runner.temp }}/scorecard

      - name: Find the agent PR
        id: pr
        run: |
          f="$RUNNER_TEMP/scorecard/verify.json"
          url=$( [ -f "$f" ] && jq -r '.pr_url // empty' "$f" )
          if [ -z "$url" ]; then
            echo "No PR from ${{ matrix.variant }}; nothing to review."
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .branch "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.url
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - uses: actions/setup-python@v5
        if: steps.pr.outputs.url
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            flask/requirements.txt
            agent/requirements.txt

      - name: Resolve the target and install its dependencies
        if: steps.pr.outputs.url
        run: |
          eval "$(python selfheal/harness/target.py --alert "$RUNNER_TEMP/scorecard/alert.json" --github-env --shell)"
          bash -c "$TARGET_INSTALL"

      - if: steps.pr.outputs.url
        uses: ./.github/actions/selfheal-claude

      - name: Reviewer agent
        if: steps.pr.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_CHANNELS: ${{ needs.plan.outputs.slack_channels }}
        run: |
          OUT="$RUNNER_TEMP/review"
          mkdir -p "$OUT"
          gh pr view "$PR_URL" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$OUT/pr.md"
          gh pr diff "$PR_URL" > "$OUT/pr.diff"
          python selfheal/harness/prepare.py review --out "$OUT"
          python selfheal/harness/run_agent.py --name "review-${{ matrix.variant }}" --variant "${{ matrix.variant }}" \
            --max-turns 15 --prompt-file "$OUT/prompt.md" --out "$OUT" \
            --allowed-tools "Read Write Glob Grep Bash(python -m pytest:*)" || true

          if [ ! -s "$OUT/review.md" ]; then
            echo "**Verdict: ?** The reviewer agent didn't produce a review; see the workflow log." > "$OUT/review.md"
          fi
          printf '\n\n_Reviewer agent. A human makes the merge decision._\n' >> "$OUT/review.md"
          gh pr comment "$PR_URL" --body-file "$OUT/review.md"
          # Notify the human in the loop: a verified fix is waiting for review
          python selfheal/harness/report.py review --pr-url "$PR_URL" --review "$OUT/review.md" \
            --variant "${{ matrix.variant }}" --results "$RUNNER_TEMP/scorecard"

  telemetry:
    # Follow-up for targets with a `telemetry` block (targets.json): a second agent takes the fix
    # PR, instruments the cause as a Sentry Application Metric in its own PR into the base, and
    # the thread gets a link to a pre-filled monitor form for it (nothing is created in Sentry).
    needs: [plan, review]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/results

      - name: Find the fix PR and the target's telemetry settings
        id: fix
        run: |
          python3 selfheal/harness/target.py --alert .selfheal/alert.json --github-env
          eval "$(python3 selfheal/harness/target.py --alert .selfheal/alert.json --shell)"
          if [ -z "$TARGET_TELEMETRY" ]; then
            echo "Target $SELFHEAL_TARGET has no telemetry follow-up."
            exit 0
          fi
          for verify in "$RUNNER_TEMP"/results/*/verify.json; do
            [ -f "$verify" ] || continue
            url=$(jq -r '.pr_url // empty' "$verify")
            if [ -n "$url" ]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "result=$(dirname "$verify")/result.json" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No fix PR this run; no telemetry follow-up."

      - uses: actions/setup-python@v5
        if: steps.fix.outputs.url
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install the target's dependencies
        if: steps.fix.outputs.url
        run: bash -c "$TARGET_INSTALL"

      - name: Post the telemetry bridge message to Slack
        # Bridges "PR ready for review" and the telemetry PR a few minutes later, so the thread
        # doesn't look finished
        if: steps.fix.outputs.url
        continue-on-error: true
        env:
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_CHANNELS: ${{ needs.plan.outputs.slack_channels }}
        run: python selfheal/harness/report.py status --kind telemetry --variant telemetry --dir .selfheal

      - if: steps.fix.outputs.url
        uses: ./.github/actions/selfheal-claude

      - name: Prepare the telemetry prompt and Sentry MCP
        if: steps.fix.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_MCP_TOKEN: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN }}
          FIX_PR_URL: ${{ steps.fix.outputs.url }}
        run: |
          OUT="$RUNNER_TEMP/selfheal/telemetry"
          SECRETS="$RUNNER_TEMP/selfheal-secrets"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "SECRETS=$SECRETS" >> "$GITHUB_ENV"
          cp .selfheal/alert.json "$OUT/alert.json"
          gh pr view "$FIX_PR_URL" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$OUT/fix_pr.md"
          gh pr diff "$FIX_PR_URL" > "$OUT/fix_pr.diff"
          python selfheal/harness/prepare.py telemetry --alert .selfheal/alert.json --out "$OUT" \
            --mcp-out "$SECRETS/mcp.json" --fix-pr-url "$FIX_PR_URL"

      - name: Telemetry agent instruments the code
        if: steps.fix.outputs.url
        continue-on-error: true  # still verify whatever it produced
        run: |
          # Read-only Sentry: whatever the token allows, every Sentry tool that changes
          # something is denied to the agent
          DISALLOWED="Read(/$SECRETS/**) Grep(/$SECRETS/**) Glob(/$SECRETS/**) $(python selfheal/harness/prepare.py sentry-write-tools)"
          TOOLS="Read Edit Write Glob Grep Bash(python -m pytest:*) ToolSearch mcp__sentry"
          python selfheal/harness/run_agent.py --name telemetry --variant telemetry \
            --prompt-file "$OUT/prompt.md" --out "$OUT" --mcp-config "$SECRETS/mcp.json" \
            --allowed-tools "$TOOLS" --disallowed-tools "$DISALLOWED"

      - name: Verify the instrumentation and open its PR
        id: pr
        if: steps.fix.outputs.url
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_MCP_TOKEN: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN }}
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_CHANNELS: ${{ needs.plan.outputs.slack_channels }}
        run: |
          rm -rf "$SECRETS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python selfheal/harness/open_telemetry_pr.py --out "$OUT" \
            --fix-pr-url "${{ steps.fix.outputs.url }}" --fix-result "${{ steps.fix.outputs.result }}"

      - name: Link a pre-filled monitor form (nothing is created in Sentry)
        if: steps.fix.outputs.url && steps.pr.outcome == 'success'
        continue-on-error: true
        env:
          # Read-only here: only to look up the project's ID for the form
          SENTRY_MCP_TOKEN: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN }}
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_CHANNELS: ${{ needs.plan.outputs.slack_channels }}
        run: python selfheal/harness/monitor_preview.py --out "$OUT"

      - name: Upload the telemetry results
        if: always() && steps.fix.outputs.url
        uses: actions/upload-artifact@v4
        with:
          name: telemetry
          if-no-files-found: ignore
          path: |
            ${{ env.OUT }}/telemetry.json
            ${{ env.OUT }}/telemetry_verify.json
            ${{ env.OUT }}/monitor_preview.json
            ${{ env.OUT }}/stats.json

  report:
    needs: [plan, fix, review, telemetry]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # delete the run branch and superseded PR branches
      pull-requests: write  # close superseded agent PRs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: results

      - name: Resolve the target
        run: python3 selfheal/harness/target.py --alert .selfheal/alert.json --github-env

      - name: Close the previous run's agent PRs
        # PRs stay open for demos, but only the latest one per alert, issue and version: once
        # this run's agent opened a PR, close that version's earlier PRs for the same run key
        # (selfheal/fix-<version>-<key>-<run id>). Other SEs' alerts, other issues, the other
        # version, and versions whose agent opened nothing this time are left alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for verify in results/*/verify.json; do
            [ -f "$verify" ] || continue
            new_pr=$(jq -r '.pr_url // empty' "$verify")
            variant=$(basename "$(dirname "$verify")")
            if [ -z "$new_pr" ]; then
              echo "$variant opened no PR; keeping its existing ones."
              continue
            fi
            gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --label selfheal-agent \
                --label "selfheal:$variant" --state open --json number,headRefName \
                --jq ".[] | select(.headRefName | startswith(\"selfheal/fix-$variant-$SELFHEAL_RUN_KEY-\"))
                          | select(.headRefName | endswith(\"-$GITHUB_RUN_ID\") | not) | .number" |
              while read -r pr; do
                gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch \
                  --comment "Superseded by a newer self-heal run: $new_pr"
              done
          done

      - name: Post to Slack if an agent opened no PR
        env:
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_CHANNELS: ${{ needs.plan.outputs.slack_channels }}
        run: |
          pip install requests
          python selfheal/harness/report.py run --alert .selfheal/alert.json --results results

      - name: Delete the run branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
