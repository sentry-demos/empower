name: selfheal-runner
# Self-healing demo. Started by a push to a selfheal/run/<id> branch: a single commit on top
# of a target's base branch that adds .selfheal/alert.json. The Cloud Run receiver creates
# these on a Sentry alert (from any configured org), and selfheal/scripts/trigger.sh creates
# them by hand. Push triggers use the workflow file on the pushed branch, so nothing here needs
# to live on master.
#
# Each job resolves the alert's target (selfheal/targets.json: base branch, Sentry org and
# project, code paths, tests, verification check) with selfheal/harness/target.py.
# Uses only the Actions GITHUB_TOKEN and the repo's existing GCP login. See selfheal/README.md.
run-name: "Self-heal: ${{ github.ref_name }}"

on:
  push:
    branches: ["selfheal/run/**"]

concurrency:
  group: selfheal-runner
  cancel-in-progress: false

env:
  # Optional overrides for the checkout target (demo); other targets use targets.json only
  SELFHEAL_VAR_SENTRY_ORG: ${{ vars.SELFHEAL_SENTRY_ORG }}
  SELFHEAL_VAR_SENTRY_PROJECT: ${{ vars.SELFHEAL_SENTRY_PROJECT }}
  SELFHEAL_VAR_SENTRY_ENVIRONMENT: ${{ vars.SELFHEAL_SENTRY_ENVIRONMENT }}
  SELFHEAL_VAR_SLACK_ALERT_MATCH: ${{ vars.SELFHEAL_SLACK_ALERT_MATCH }}
  SELFHEAL_MODEL: ${{ vars.SELFHEAL_MODEL }}
  SELFHEAL_MAX_TURNS: ${{ vars.SELFHEAL_MAX_TURNS }}
  SELFHEAL_HAIKU_MODEL: ${{ vars.SELFHEAL_HAIKU_MODEL }}
  SELFHEAL_MODEL_PROVIDER: ${{ vars.SELFHEAL_MODEL_PROVIDER || 'openrouter' }}
  SELFHEAL_MODEL_KEY_SECRET: ${{ vars.SELFHEAL_MODEL_KEY_SECRET || 'AGENT_OPENROUTER_API_KEY' }}
  SELFHEAL_GCP_PROJECT: ${{ vars.SELFHEAL_GCP_PROJECT || 'sales-engineering-sf' }}
  SELFHEAL_HARNESS_DSN: ${{ vars.SELFHEAL_HARNESS_DSN }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  announce:
    # Replies in the Sentry alert's Slack thread as soon as the run starts. Runs alongside the
    # fix jobs (nothing waits on it), and a Slack problem never fails the run.
    if: vars.SELFHEAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            selfheal
            .selfheal

      - name: Post "self-heal started"
        continue-on-error: true
        env:
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_WEBHOOK_URL: ${{ secrets.SELFHEAL_SLACK_WEBHOOK_URL }}
          VARIANTS: ${{ vars.SELFHEAL_VARIANTS || '["without-seer"]' }}
        run: |
          pip install requests
          eval "$(python selfheal/harness/target.py --alert .selfheal/alert.json --shell)"
          python selfheal/harness/report.py started --alert .selfheal/alert.json --variants "$VARIANTS"

  fix:
    if: vars.SELFHEAL_ENABLED == 'true'  # opt-in per repo, so forks and other repos never run it
    name: fix (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # push the fix branch
      pull-requests: write  # open the draft PR
      issues: write         # create the PR labels
      statuses: write       # post the required `pytest` status on the PR head
      id-token: write       # GCP login for the model key
    strategy:
      fail-fast: false
      matrix:
        # with-seer is off until Seer is set up for the project; turn it on with the repo variable
        # SELFHEAL_VARIANTS='["without-seer", "with-seer"]'
        variant: ${{ fromJSON(vars.SELFHEAL_VARIANTS || '["without-seer"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Take the alert, resolve its target, then work from the target's base
        run: |
          OUT="$RUNNER_TEMP/selfheal/${{ matrix.variant }}"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          cp .selfheal/alert.json "$RUNNER_TEMP/selfheal/alert.json"
          cp .selfheal/alert.json "$OUT/alert.json"  # travels with the scorecard to the review job
          cat "$RUNNER_TEMP/selfheal/alert.json"
          python3 selfheal/harness/target.py --alert "$RUNNER_TEMP/selfheal/alert.json" --github-env
          # The run commit only adds the alert file; drop it so it never reaches the agent's PR
          git reset -q --hard HEAD~1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            flask/requirements.txt
            agent/requirements.txt

      - name: Install the target's dependencies
        run: bash -c "$TARGET_INSTALL"

      - uses: ./.github/actions/selfheal-claude

      - name: Prepare prompt and Sentry MCP
        env:
          # One Sentry token per org; prepare.py picks the alert's
          SENTRY_MCP_TOKEN: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN }}
          SENTRY_MCP_TOKEN_TEAM_SE: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN_TEAM_SE }}
        run: |
          # The MCP config holds the Sentry token and model key: keep it in its own folder,
          # which the agent is denied from reading (next step)
          SECRETS="$RUNNER_TEMP/selfheal-secrets"
          echo "SECRETS=$SECRETS" >> "$GITHUB_ENV"
          python selfheal/harness/prepare.py fix --variant ${{ matrix.variant }} \
            --alert "$RUNNER_TEMP/selfheal/alert.json" --out "$OUT" --mcp-out "$SECRETS/mcp.json"

      - name: Agent diagnoses and fixes (${{ matrix.variant }})
        continue-on-error: true  # still verify and score whatever it produced
        run: |
          DISALLOWED="Read(/$SECRETS/**) Grep(/$SECRETS/**) Glob(/$SECRETS/**)"
          if [ "${{ matrix.variant }}" = "without-seer" ]; then
            DISALLOWED="$DISALLOWED mcp__sentry__analyze_issue_with_seer"
          fi
          ALLOWED_BASH=$(python selfheal/harness/prepare.py allowed-bash)
          python selfheal/harness/run_agent.py \
            --name "fix-${{ matrix.variant }}" --variant "${{ matrix.variant }}" \
            --prompt-file "$OUT/prompt.md" --out "$OUT" --mcp-config "$SECRETS/mcp.json" \
            --allowed-tools "Read Edit Write Glob Grep ToolSearch $ALLOWED_BASH mcp__sentry" \
            --disallowed-tools "$DISALLOWED"

      - name: Verify independently and open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          # For the leak check only
          SENTRY_MCP_TOKEN: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN }}
          SENTRY_MCP_TOKEN_TEAM_SE: ${{ secrets.SELFHEAL_SENTRY_MCP_TOKEN_TEAM_SE }}
        run: |
          rm -rf "$SECRETS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python selfheal/harness/open_pr.py --variant ${{ matrix.variant }} --out "$OUT"

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}
          path: |
            ${{ env.OUT }}/stats.json
            ${{ env.OUT }}/verify.json
            ${{ env.OUT }}/result.json
            ${{ env.OUT }}/cart.json
            ${{ env.OUT }}/alert.json
          if-no-files-found: warn

  review:
    # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows, so the reviewer
    # agent runs here, once per agent PR. It only comments; a human approves and merges.
    needs: fix
    if: always() && vars.SELFHEAL_ENABLED == 'true'
    name: review (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # with-seer is off until Seer is set up for the project; turn it on with the repo variable
        # SELFHEAL_VARIANTS='["without-seer", "with-seer"]'
        variant: ${{ fromJSON(vars.SELFHEAL_VARIANTS || '["without-seer"]') }}

    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.variant }}
          path: ${{ runner.temp }}/scorecard

      - name: Find the agent PR
        id: pr
        run: |
          f="$RUNNER_TEMP/scorecard/verify.json"
          url=$( [ -f "$f" ] && jq -r '.pr_url // empty' "$f" )
          if [ -z "$url" ]; then
            echo "No PR from ${{ matrix.variant }}; nothing to review."
            exit 0
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .branch "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.url
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - uses: actions/setup-python@v5
        if: steps.pr.outputs.url
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            flask/requirements.txt
            agent/requirements.txt

      - name: Resolve the target and install its dependencies
        if: steps.pr.outputs.url
        run: |
          eval "$(python selfheal/harness/target.py --alert "$RUNNER_TEMP/scorecard/alert.json" --github-env --shell)"
          bash -c "$TARGET_INSTALL"

      - if: steps.pr.outputs.url
        uses: ./.github/actions/selfheal-claude

      - name: Reviewer agent
        if: steps.pr.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_WEBHOOK_URL: ${{ secrets.SELFHEAL_SLACK_WEBHOOK_URL }}
        run: |
          OUT="$RUNNER_TEMP/review"
          mkdir -p "$OUT"
          gh pr view "$PR_URL" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$OUT/pr.md"
          gh pr diff "$PR_URL" > "$OUT/pr.diff"
          python selfheal/harness/prepare.py review --out "$OUT"
          python selfheal/harness/run_agent.py --name "review-${{ matrix.variant }}" --variant "${{ matrix.variant }}" \
            --max-turns 15 --prompt-file "$OUT/prompt.md" --out "$OUT" \
            --allowed-tools "Read Write Glob Grep Bash(python -m pytest:*)" || true

          if [ ! -s "$OUT/review.md" ]; then
            echo "**Verdict: ?** The reviewer agent didn't produce a review; see the workflow log." > "$OUT/review.md"
          fi
          printf '\n\n_Reviewer agent. A human makes the merge decision._\n' >> "$OUT/review.md"
          gh pr comment "$PR_URL" --body-file "$OUT/review.md"
          # Notify the human in the loop: a verified fix is waiting for review
          python selfheal/harness/report.py review --pr-url "$PR_URL" --review "$OUT/review.md" \
            --variant "${{ matrix.variant }}" --results "$RUNNER_TEMP/scorecard"

  report:
    needs: [fix, review]
    if: always() && vars.SELFHEAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # delete the run branch and superseded PR branches
      pull-requests: write  # close superseded agent PRs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: results

      - name: Resolve the target
        run: python3 selfheal/harness/target.py --alert .selfheal/alert.json --github-env

      - name: Close the previous run's agent PRs for this target
        # PRs stay open for demos, but only the latest pair per target: once this run has
        # opened at least one PR, close agent PRs from earlier runs into the same base branch.
        # A failed run leaves them alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_prs=$(jq -r '.pr_url // empty' results/*/verify.json 2>/dev/null | tr '\n' ' ')
          if [ -z "$new_prs" ]; then
            echo "This run opened no PRs; keeping the existing ones."
            exit 0
          fi
          gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --label selfheal-agent --state open \
              --json number,headRefName --jq ".[] | select(.headRefName | endswith(\"-$GITHUB_RUN_ID\") | not) | .number" |
            while read -r pr; do
              gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch \
                --comment "Superseded by a newer self-heal run: $new_prs"
            done

      - name: Post to Slack if an agent opened no PR
        env:
          SELFHEAL_SLACK_BOT_TOKEN: ${{ secrets.SELFHEAL_SLACK_BOT_TOKEN }}
          SELFHEAL_SLACK_CHANNEL: ${{ vars.SELFHEAL_SLACK_CHANNEL }}
          SELFHEAL_SLACK_WEBHOOK_URL: ${{ secrets.SELFHEAL_SLACK_WEBHOOK_URL }}
        run: |
          pip install requests
          python selfheal/harness/report.py run --alert .selfheal/alert.json --results results

      - name: Delete the run branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
