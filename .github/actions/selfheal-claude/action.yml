name: selfheal-claude
description: >
  Install Claude Code and point it at a model key read from GCP Secret Manager at runtime,
  through the repo's existing workload identity login. No model key is stored in GitHub.
  The job needs `permissions: id-token: write`.

runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

    - uses: google-github-actions/setup-gcloud@v3

    - name: Read the model key from Secret Manager
      shell: bash
      env:
        PROVIDER: ${{ env.SELFHEAL_MODEL_PROVIDER }}
        SECRET: ${{ env.SELFHEAL_MODEL_KEY_SECRET }}
        GCP_PROJECT: ${{ env.SELFHEAL_GCP_PROJECT }}
      run: |
        key=$(gcloud secrets versions access latest --secret="$SECRET" --project="$GCP_PROJECT")
        echo "::add-mask::$key"
        case "$PROVIDER" in
          openrouter)
            # Claude Code talks to OpenRouter's Anthropic-compatible endpoint with this key
            if [ -z "$SELFHEAL_MODEL" ]; then
              echo "::error::Set the SELFHEAL_MODEL repo variable to an OpenRouter model id for Claude (provider/model)."
              exit 1
            fi
            # Per OpenRouter's Claude Code guide. The Haiku override covers Claude Code's
            # quick background calls, which otherwise ask for a model id OpenRouter may not map.
            {
              echo "ANTHROPIC_BASE_URL=https://openrouter.ai/api"
              echo "ANTHROPIC_AUTH_TOKEN=$key"
              echo "ANTHROPIC_API_KEY="
              echo "ANTHROPIC_DEFAULT_HAIKU_MODEL=${SELFHEAL_HAIKU_MODEL:-anthropic/claude-haiku-5.5}"
            } >> "$GITHUB_ENV"
            ;;
          anthropic)
            echo "ANTHROPIC_API_KEY=$key" >> "$GITHUB_ENV"
            ;;
          *)
            echo "::error::Unknown SELFHEAL_MODEL_PROVIDER '$PROVIDER' (expected openrouter or anthropic)"
            exit 1
            ;;
        esac
        echo "Model key: $SECRET via $PROVIDER"

    - name: Drop GCP credentials
      # The key is all the job needs from GCP. google-github-actions/auth writes its credentials
      # file into the checkout, where the agent could read it and the harness would see it as a
      # change, so remove it and sign gcloud out before any agent runs.
      shell: bash
      run: |
        gcloud auth revoke --all --quiet 2>/dev/null || true
        rm -f "$GOOGLE_GHA_CREDS_PATH" "$GITHUB_WORKSPACE"/gha-creds-*.json
        {
          echo "GOOGLE_APPLICATION_CREDENTIALS="
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
          echo "GOOGLE_GHA_CREDS_PATH="
        } >> "$GITHUB_ENV"

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install Claude Code and cache the Sentry MCP
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code
        # Pre-fetch so the agent's `npx -y @sentry/mcp-server@...` starts without a download
        npm cache add "${SENTRY_MCP_PACKAGE:-@sentry/mcp-server@0.42.0}"
